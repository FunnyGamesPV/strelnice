<!DOCTYPE html>
<html lang="cs">
<head>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌹</text></svg>">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pouťová střelnice / Fairground Shooting Gallery</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #1a110b;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    header {
      width: 100%;
      max-width: 900px;
      padding: 10px 15px;
      background: #2b1b12;
      border-bottom: 3px solid #8b5a2b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .stats {
      display: flex;
      gap: 12px;
      font-size: 14px;
      font-weight: bold;
      flex-wrap: wrap;
    }
    .stat-badge {
      background: #412a1c;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #a3703c;
    }
    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    button {
      background: #c0392b;
      color: #fff;
      border: 1px solid #f39c12;
      padding: 7px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.15s;
    }
    button:hover { background: #e74c3c; }
    button.finish-btn { background: #27ae60; border-color: #2ecc71; }
    button.finish-btn:hover { background: #2ecc71; }
    .lang-btn { background: #50311c; border-color: #8b5a2b; }
    .lang-btn:hover { background: #694025; }
    
    #canvas-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      aspect-ratio: 16 / 10;
      margin-top: 10px;
      touch-action: none;
      cursor: crosshair;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      background: #111;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
      padding: 15px;
      z-index: 100;
    }
    .modal-content {
      background: #2b1b12;
      border: 2px solid #a3703c;
      padding: 20px;
      border-radius: 12px;
      max-width: 450px;
      width: 100%;
      text-align: center;
    }
    .modal h2 { margin-bottom: 12px; color: #f39c12; }
    .shop-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 15px 0;
    }
    .shop-btn {
      background: #50311c;
      font-size: 15px;
      padding: 12px;
      border-radius: 8px;
    }
    .shop-btn:hover { background: #694025; }

    #cardCanvas {
      width: 100%;
      max-width: 380px;
      aspect-ratio: 4 / 5;
      border-radius: 8px;
      margin: 12px auto;
      display: block;
      background: #fff;
    }
    textarea {
      width: 100%;
      height: 60px;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #a3703c;
      font-family: inherit;
      resize: none;
      font-size: 14px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <header>
    <div class="stats">
      <div class="stat-badge"><span data-i18n="ammo">Broky</span>: <span id="ammoCount" style="color: #f1c40f;">3</span></div>
      <div class="stat-badge"><span data-i18n="spent">Útrata</span>: <span id="spentCount" style="color: #e67e22;">0</span> <span data-i18n="currency">Kč</span></div>
      <div class="stat-badge"><span data-i18n="won">Získáno</span>: <span id="wonCount" style="color: #2ecc71;">0</span></div>
    </div>
    <div class="actions">
      <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">EN</button>
      <button onclick="openShop()" data-i18n="buyBtn">Koupit broky</button>
      <button class="finish-btn" onclick="openEndScreen()" data-i18n="finishBtn">Ukončit a darovat</button>
    </div>
  </header>

  <div id="canvas-container">
    <canvas id="gameCanvas" width="1000" height="625"></canvas>
  </div>

  <!-- Nákupní okno -->
  <div class="modal" id="shopModal">
    <div class="modal-content">
      <h2 data-i18n="shopTitle">Pokladna střelnice</h2>
      <p data-i18n="shopSubtitle" style="color: #e0d0b8; margin-bottom: 15px;">Vyberte si balíček střeliva:</p>
      <div class="shop-options">
        <button class="shop-btn" onclick="buyAmmo(10, 10)"><span data-i18n="buy10">10 broků – 10 Kč</span></button>
        <button class="shop-btn" onclick="buyAmmo(25, 20)"><span data-i18n="buy25">25 broků – 20 Kč</span></button>
        <button class="shop-btn" onclick="buyAmmo(50, 40)"><span data-i18n="buy50">50 broků – 40 Kč</span></button>
      </div>
      <button onclick="closeShop()" style="background:#555; border-color:#777;" data-i18n="backBtn">Zpět ke střelbě</button>
    </div>
  </div>

  <!-- Závěrečná karta -->
  <div class="modal" id="giftModal">
    <div class="modal-content" style="max-width: 480px;">
      <h2 data-i18n="cardTitle">Tvoje vystřelené růže</h2>
      <canvas id="cardCanvas" width="400" height="500"></canvas>
      <textarea id="giftMessage" oninput="drawCard()"></textarea>
      <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
        <button class="finish-btn" onclick="downloadCard()" data-i18n="downloadBtn">Stáhnout obrázek</button>
        <button onclick="closeEndScreen()" style="background:#555; border-color:#777;" data-i18n="backBtn">Zpět</button>
        <button onclick="restartGame()" style="background:#c0392b;" data-i18n="restartBtn">Nová hra</button>
      </div>
    </div>
  </div>

<script>
  const i18n = {
    cs: {
      ammo: "Broky",
      spent: "Útrata",
      won: "Získáno",
      currency: "Kč",
      buyBtn: "Koupit broky",
      finishBtn: "Ukončit a darovat",
      shopTitle: "Pokladna střelnice",
      shopSubtitle: "Vyberte si balíček střeliva:",
      buy10: "10 broků – 10 Kč",
      buy25: "25 broků – 20 Kč",
      buy50: "50 broků – 40 Kč",
      backBtn: "Zpět",
      cardTitle: "Tvoje vystřelené růže",
      downloadBtn: "Stáhnout obrázek",
      restartBtn: "Nová hra",
      defaultDedication: "Stříleno z lásky na pouti ❤️",
      cardFooter: "Vystřeleno z pouťové vzduchovky",
      noRoses: "Zatím jsi netrefil žádnou růži...",
      boughtAlert: "Úspěšně nabito!"
    },
    en: {
      ammo: "Pellets",
      spent: "Spent",
      won: "Won",
      currency: "CZK",
      buyBtn: "Buy Pellets",
      finishBtn: "Finish & Gift",
      shopTitle: "Shooting Gallery Cashier",
      shopSubtitle: "Choose your ammo pack:",
      buy10: "10 pellets – 10 CZK",
      buy25: "25 pellets – 20 CZK",
      buy50: "50 pellets – 40 CZK",
      backBtn: "Back",
      cardTitle: "Your Won Roses",
      downloadBtn: "Download Image",
      restartBtn: "New Game",
      defaultDedication: "Shot with love at the fairground ❤️",
      cardFooter: "Shot with a fairground air rifle",
      noRoses: "No roses hit yet...",
      boughtAlert: "Ammo loaded successfully!"
    }
  };

  let currentLang = 'cs';

  function setLanguage(lang) {
    currentLang = lang;
    document.getElementById('langBtn').textContent = lang === 'cs' ? 'EN' : 'CZ';
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (i18n[lang][key]) el.textContent = i18n[lang][key];
    });
    const messageInput = document.getElementById('giftMessage');
    if (!messageInput.value || messageInput.value === i18n.cs.defaultDedication || messageInput.value === i18n.en.defaultDedication) {
      messageInput.value = i18n[lang].defaultDedication;
    }
    drawCard();
  }

  function toggleLanguage() {
    setLanguage(currentLang === 'cs' ? 'en' : 'cs');
  }

  // Audio efekty
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    if (type === 'shot') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(320, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.11);
    } else if (type === 'hit') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(750, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(90, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.09);
    }
  }

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  let ammo = 3;
  let spent = 0;
  let wonRoses = [];
  let targetRoses = [];
  let crosshair = { x: 500, y: 312 };
  let recoilOffset = { x: 0, y: 0 };
  const ROSE_COLORS = ['#e74c3c', '#f1c40f', '#e84393', '#3498db', '#9b59b6', '#e67e22'];

  function initTargets() {
    targetRoses = [];
    wonRoses = [];

    // 10 malých růží (1 špejle)
    for (let i = 0; i < 10; i++) {
      const x = 70 + i * 95;
      const color = ROSE_COLORS[Math.floor(Math.random() * ROSE_COLORS.length)];
      targetRoses.push({
        type: 'small', color, x, y: 480, radius: 18,
        sticks: [{ x, yTop: 498, yBottom: 565, broken: false }],
        isFallen: false, fallProgress: 0
      });
    }

    // 3 střední růže (3 špejle)
    for (let i = 0; i < 3; i++) {
      const x = 220 + i * 280;
      const color = ROSE_COLORS[Math.floor(Math.random() * ROSE_COLORS.length)];
      targetRoses.push({
        type: 'medium', color, x, y: 320, radius: 30,
        sticks: [
          { x: x - 18, yTop: 350, yBottom: 425, broken: false },
          { x: x,      yTop: 350, yBottom: 425, broken: false },
          { x: x + 18, yTop: 350, yBottom: 425, broken: false }
        ],
        isFallen: false, fallProgress: 0
      });
    }

    // 1 velká růže (5 špejlí)
    const bigColor = ROSE_COLORS[Math.floor(Math.random() * ROSE_COLORS.length)];
    targetRoses.push({
      type: 'large', color: bigColor, x: 500, y: 160, radius: 46,
      sticks: [
        { x: 464, yTop: 205, yBottom: 290, broken: false },
        { x: 482, yTop: 205, yBottom: 290, broken: false },
        { x: 500, yTop: 205, yBottom: 290, broken: false },
        { x: 518, yTop: 205, yBottom: 290, broken: false },
        { x: 536, yTop: 205, yBottom: 290, broken: false }
      ],
      isFallen: false, fallProgress: 0
    });

    updateStats();
  }

  function updateStats() {
    document.getElementById('ammoCount').textContent = ammo;
    document.getElementById('spentCount').textContent = spent;
    document.getElementById('wonCount').textContent = wonRoses.length;
  }

  function shoot(targetX, targetY) {
    if (ammo <= 0) {
      openShop();
      return;
    }

    ammo--;
    playSound('shot');

    // Lehký rozptyl vzduchovky
    const spreadX = (Math.random() - 0.5) * 14;
    const spreadY = (Math.random() - 0.5) * 14;
    const hitX = targetX + spreadX;
    const hitY = targetY + spreadY;

    // Zpětný ráz
    recoilOffset.y = -15;
    recoilOffset.x = (Math.random() - 0.5) * 8;

    let hitSomething = false;
    for (const rose of targetRoses) {
      if (rose.isFallen) continue;

      for (const stick of rose.sticks) {
        if (stick.broken) continue;

        if (hitX >= stick.x - 6 && hitX <= stick.x + 6 &&
            hitY >= stick.yTop && hitY <= stick.yBottom) {
          stick.broken = true;
          hitSomething = true;
          playSound('hit');
          break;
        }
      }

      if (!rose.isFallen && rose.sticks.every(s => s.broken)) {
        rose.isFallen = true;
        wonRoses.push({ color: rose.color, type: rose.type });
      }
      if (hitSomething) break;
    }

    updateStats();

    const allCleared = targetRoses.every(r => r.isFallen);
    if (allCleared) {
      setTimeout(openEndScreen, 800);
    } else if (ammo === 0) {
      // Došly broky: otevřeme rovnou pokladnu na dokoupení
      setTimeout(() => {
        if (ammo === 0) openShop();
      }, 500);
    }
  }

  function drawPaperRose(ctx, x, y, radius, color) {
    ctx.save();
    ctx.translate(x, y);
    const petals = 7;
    for (let i = 0; i < petals; i++) {
      const angle = (i * Math.PI * 2) / petals;
      ctx.beginPath();
      ctx.arc(Math.cos(angle) * (radius * 0.45), Math.sin(angle) * (radius * 0.45), radius * 0.55, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.25)';
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(0, 0, radius * 0.38, 0, Math.PI * 2);
    ctx.fillStyle = '#fff3';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(0, 0, radius * 0.2, 0, Math.PI * 2);
    ctx.fillStyle = '#222';
    ctx.fill();
    ctx.restore();
  }

  function gameLoop() {
    recoilOffset.x *= 0.82;
    recoilOffset.y *= 0.82;

    ctx.fillStyle = '#2b1b12';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#1c110a';
    ctx.fillRect(0, 565, 1000, 20);
    ctx.fillRect(0, 425, 1000, 15);
    ctx.fillRect(0, 290, 1000, 15);

    for (const rose of targetRoses) {
      for (const stick of rose.sticks) {
        if (!stick.broken) {
          ctx.strokeStyle = '#d7b377';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(stick.x, stick.yTop);
          ctx.lineTo(stick.x, stick.yBottom);
          ctx.stroke();
        } else {
          ctx.strokeStyle = '#8b5a2b';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(stick.x, stick.yBottom - 15);
          ctx.lineTo(stick.x + 6, stick.yBottom);
          ctx.stroke();
        }
      }

      if (rose.isFallen && rose.fallProgress < 120) {
        rose.fallProgress += 8;
      }

      const drawY = rose.y + (rose.isFallen ? rose.fallProgress * 2 : 0);
      const alpha = Math.max(0, 1 - rose.fallProgress / 100);

      if (alpha > 0) {
        ctx.globalAlpha = alpha;
        drawPaperRose(ctx, rose.x, drawY, rose.radius, rose.color);
        ctx.globalAlpha = 1;
      }
    }

    const curX = crosshair.x + recoilOffset.x;
    const curY = crosshair.y + recoilOffset.y;

    ctx.strokeStyle = '#e74c3c';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(curX, curY, 18, 0, Math.PI * 2);
    ctx.moveTo(curX - 26, curY);
    ctx.lineTo(curX + 26, curY);
    ctx.moveTo(curX, curY - 26);
    ctx.lineTo(curX, curY + 26);
    ctx.stroke();

    requestAnimationFrame(gameLoop);
  }

  function getCanvasCoords(evt) {
    const rect = canvas.getBoundingClientRect();
    const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
    const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
    return {
      x: (clientX - rect.left) * (canvas.width / rect.width),
      y: (clientY - rect.top) * (canvas.height / rect.height)
    };
  }

  canvas.addEventListener('mousemove', (e) => {
    const c = getCanvasCoords(e);
    crosshair.x = c.x; crosshair.y = c.y;
  });

  canvas.addEventListener('mousedown', (e) => {
    const c = getCanvasCoords(e);
    shoot(c.x, c.y);
  });

  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const c = getCanvasCoords(e);
    crosshair.x = c.x; crosshair.y = c.y;
    shoot(c.x, c.y);
  }, { passive: false });

  function openShop() { document.getElementById('shopModal').style.display = 'flex'; }
  function closeShop() { document.getElementById('shopModal').style.display = 'none'; }
  
  // Nákupní logika s balíčky (10 za 10, 25 za 20, 50 za 40)
  function buyAmmo(amount, price) {
    ammo += amount;
    spent += price;
    updateStats();
    closeShop();
  }

  function openEndScreen() {
    document.getElementById('giftModal').style.display = 'flex';
    drawCard();
  }
  function closeEndScreen() {
    document.getElementById('giftModal').style.display = 'none';
  }

  function drawCard() {
    const card = document.getElementById('cardCanvas');
    const cCtx = card.getContext('2d');
    const text = document.getElementById('giftMessage').value;

    cCtx.fillStyle = '#fffdf7';
    cCtx.fillRect(0, 0, card.width, card.height);
    cCtx.lineWidth = 6;
    cCtx.strokeStyle = '#c2a649';
    cCtx.strokeRect(10, 10, card.width - 20, card.height - 20);

    if (wonRoses.length === 0) {
      cCtx.fillStyle = '#777';
      cCtx.font = 'italic 16px serif';
      cCtx.textAlign = 'center';
      cCtx.fillText(i18n[currentLang].noRoses, 200, 200);
    } else {
      cCtx.strokeStyle = '#27ae60';
      cCtx.lineWidth = 3;
      wonRoses.forEach((_, i) => {
        cCtx.beginPath();
        cCtx.moveTo(200, 320);
        cCtx.quadraticCurveTo(180 + (i % 5) * 10, 240, 140 + (i * 35) % 150, 160 + (i * 20) % 80);
        cCtx.stroke();
      });

      cCtx.fillStyle = '#c0392b';
      cCtx.beginPath();
      cCtx.arc(200, 320, 10, 0, Math.PI * 2);
      cCtx.fill();

      wonRoses.forEach((rose, i) => {
        const posX = 130 + (i * 45) % 150;
        const posY = 130 + (i * 35) % 90;
        const r = rose.type === 'large' ? 30 : (rose.type === 'medium' ? 22 : 16);
        drawPaperRose(cCtx, posX, posY, r, rose.color);
      });
    }

    cCtx.fillStyle = '#2c3e50';
    cCtx.font = 'bold 18px "Georgia", serif';
    cCtx.textAlign = 'center';
    
    const words = text.split(' ');
    let line = '';
    let y = 375;
    for (let n = 0; n < words.length; n++) {
      const testLine = line + words[n] + ' ';
      if (cCtx.measureText(testLine).width > 340 && n > 0) {
        cCtx.fillText(line, 200, y);
        line = words[n] + ' ';
        y += 24;
      } else {
        line = testLine;
      }
    }
    cCtx.fillText(line, 200, y);

    cCtx.font = 'italic 12px sans-serif';
    cCtx.fillStyle = '#888';
    cCtx.fillText(i18n[currentLang].cardFooter, 200, 470);
  }

  function downloadCard() {
    const card = document.getElementById('cardCanvas');
    const link = document.createElement('a');
    link.download = 'vystrelena-ruze.png';
    link.href = card.toDataURL('image/png');
    link.click();
  }

  function restartGame() {
    closeEndScreen();
    spent = 0;
    ammo = 3;
    initTargets();
  }

  setLanguage('cs');
  initTargets();
  gameLoop();
</script>
</body>
</html>
