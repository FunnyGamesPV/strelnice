<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pouťová Střelnice</title>

  <!-- PWA Mobilní aplikace -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#8b1e0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Střelnice">

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      background: #110803;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      border: 4px solid #4a1c0d;
      border-radius: 8px;
      box-shadow: 0 0 25px rgba(0,0,0,0.8);
      background: #2b1d0c;
      max-width: 100vw;
      max-height: 100vh;
    }
    canvas {
      display: block;
      cursor: crosshair;
      touch-action: none;
    }
    #ui-bar {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-size: 14px;
      font-weight: bold;
      text-shadow: 2px 2px 4px #000;
    }
    .hud-badge {
      background: rgba(0,0,0,0.7);
      padding: 4px 10px;
      border-radius: 16px;
      border: 1px solid #d4af37;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    #lock-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(10,5,3,0.95);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      text-align: center;
      padding: 15px;
    }
    #lock-overlay h2 {
      font-size: 26px;
      color: #e74c3c;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    #lock-overlay p {
      font-size: 15px;
      margin-bottom: 20px;
      color: #ddd;
    }
    .store-grid {
      display: flex;
      gap: 12px;
      flex-direction: column;
      width: 100%;
      max-width: 260px;
    }
    .buy-btn {
      background: linear-gradient(135deg, #c0392b, #8b1e0f);
      border: 2px solid #f1c40f;
      color: #fff;
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .buy-btn:active {
      transform: scale(0.97);
    }
    #admin-gate {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #110803;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>

  <div id="admin-gate" style="display: none;">
    <h1 style="color: #e74c3c; margin-bottom: 15px;">STŘELNICE MIMO PROVOZ</h1>
    <p style="color: #ccc; max-width: 400px; line-height: 1.5;">Provoz střelnice je v tuto chvíli vyhrazen pro zvané hosty. Pro přístup použijte autorizační odkaz.</p>
  </div>

  <div id="game-container">
    <canvas id="canvas" width="800" height="500"></canvas>
    
    <div id="ui-bar">
      <div class="hud-badge">🎯 <span id="ammo-count">3</span></div>
      <div class="hud-badge">🌹 <span id="rose-count">0</span></div>
      <div class="hud-badge">💰 <span id="spent-count">0</span> Kč</div>
    </div>

    <div id="lock-overlay">
      <h2>Došly ti broky!</h2>
      <p>Kup si další střelivo do vzduchovky:</p>
      <div class="store-grid">
        <button class="buy-btn" onclick="buyAmmo(10)">10 broků / 15 Kč</button>
        <button class="buy-btn" onclick="buyAmmo(25)">25 broků / 25 Kč</button>
        <button class="buy-btn" onclick="buyAmmo(50)">50 broků / 45 Kč</button>
      </div>
    </div>
  </div>

  <script>
    // 1. Zabezpečení
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('admin') !== 'strelnice2026') {
      document.getElementById('admin-gate').style.display = 'flex';
      document.getElementById('game-container').style.display = 'none';
      throw new Error('Nepovolený přístup');
    }

    // 2. Stav hry
    let ammo = parseInt(sessionStorage.getItem('strelnice_ammo')) || 3;
    let spent = parseInt(sessionStorage.getItem('strelnice_spent')) || 0;
    let rosesWon = parseInt(sessionStorage.getItem('strelnice_roses')) || 0;

    function handlePaymentReturn() {
      if (urlParams.get('payment') === 'success') {
        const addedAmmo = parseInt(urlParams.get('ammo')) || 10;
        const addedSpent = parseInt(urlParams.get('spent')) || 15;
        ammo += addedAmmo;
        spent += addedSpent;
        sessionStorage.setItem('strelnice_ammo', ammo);
        sessionStorage.setItem('strelnice_spent', spent);
        window.history.replaceState({}, document.title, window.location.pathname + '?admin=strelnice2026');
      }
    }
    handlePaymentReturn();

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const ammoDisplay = document.getElementById('ammo-count');
    const roseDisplay = document.getElementById('rose-count');
    const spentDisplay = document.getElementById('spent-count');
    const lockOverlay = document.getElementById('lock-overlay');

    // 3. Responzivní přizpůsobení obrazovce mobilu
    function resizeCanvas() {
      const maxWidth = window.innerWidth;
      const maxHeight = window.innerHeight;
      const aspect = 800 / 500;

      let w = maxWidth;
      let h = maxWidth / aspect;

      if (h > maxHeight) {
        h = maxHeight;
        w = maxHeight * aspect;
      }

      canvas.style.width = `${w}px`;
      canvas.style.height = `${h}px`;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 4. Zvukový generátor (Web Audio API - bez stahování MP3)
    let audioCtx = null;
    function playGunshot() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        // Šumový impuls (prásknutí pístu vzduchovky)
        const bufferSize = audioCtx.sampleRate * 0.12;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1400, audioCtx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.12);

        const gainNode = audioCtx.createGain();
        gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);

        noise.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        noise.start();
      } catch (e) {
        console.warn('Audio nelze přehrát:', e);
      }
    }

    function updateHud() {
      ammoDisplay.innerText = ammo;
      roseDisplay.innerText = rosesWon;
      spentDisplay.innerText = spent;
      sessionStorage.setItem('strelnice_ammo', ammo);
      sessionStorage.setItem('strelnice_roses', rosesWon);
      sessionStorage.setItem('strelnice_spent', spent);

      if (ammo <= 0) {
        lockOverlay.style.display = 'flex';
      } else {
        lockOverlay.style.display = 'none';
      }
    }

    // 5. Terče s růžemi
    class RoseTarget {
      constructor(x, y, roseType) {
        this.x = x;
        this.y = y;
        this.stemHeight = 140;
        this.roseType = roseType;
        this.hitsLeft = 3;
        this.isFallen = false;
        this.fallSpeed = 0;
      }

      draw() {
        if (this.isFallen) {
          this.y += this.fallSpeed;
          this.fallSpeed += 0.5;
          if (this.y > 600) return;
        }

        ctx.strokeStyle = '#d2b48c';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x, this.y + this.stemHeight);
        ctx.stroke();

        if (this.hitsLeft < 3) {
          ctx.strokeStyle = '#3a1f04';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(this.x - 5, this.y + 70);
          ctx.lineTo(this.x + 5, this.y + 70);
          ctx.stroke();
        }
        if (this.hitsLeft < 2) {
          ctx.beginPath();
          ctx.moveTo(this.x - 5, this.y + 80);
          ctx.lineTo(this.x + 5, this.y + 80);
          ctx.stroke();
        }

        ctx.fillStyle = this.roseType === 'yellow' ? '#f1c40f' : (this.roseType === 'white' ? '#ecf0f1' : '#e74c3c');
        ctx.beginPath();
        ctx.arc(this.x, this.y, 22, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = this.roseType === 'yellow' ? '#d4ac0d' : (this.roseType === 'white' ? '#bdc3c7' : '#c0392b');
        ctx.beginPath();
        ctx.arc(this.x, this.y, 14, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#27ae60';
        ctx.beginPath();
        ctx.arc(this.x - 12, this.y + 14, 6, 0, Math.PI * 2);
        ctx.arc(this.x + 12, this.y + 14, 6, 0, Math.PI * 2);
        ctx.fill();
      }

      checkHit(hx, hy) {
        if (this.isFallen) return false;
        if (hx >= this.x - 10 && hx <= this.x + 10 && hy >= this.y + 15 && hy <= this.y + this.stemHeight) {
          this.hitsLeft--;
          if (this.hitsLeft <= 0) {
            this.isFallen = true;
            this.fallSpeed = 2;
            rosesWon++;
          }
          return true;
        }
        return false;
      }
    }

    const targets = [];
    const colors = ['red', 'yellow', 'white', 'red', 'yellow'];
    for (let i = 0; i < 5; i++) {
      targets.push(new RoseTarget(120 + i * 140, 140, colors[i]));
    }

    // 6. Míření a přepočet souřadnic dotyku
    let crosshair = { x: 400, y: 250 };
    let recoil = { x: 0, y: 0 };

    function getCanvasCoordinates(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    canvas.addEventListener('mousemove', (e) => {
      const pos = getCanvasCoordinates(e.clientX, e.clientY);
      crosshair.x = pos.x;
      crosshair.y = pos.y;
    });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      const pos = getCanvasCoordinates(touch.clientX, touch.clientY);
      crosshair.x = pos.x;
      crosshair.y = pos.y;
    }, { passive: false });

    function shoot() {
      playGunshot();

      if (ammo <= 0) return;
      ammo--;
      recoil.y = -12;
      recoil.x = (Math.random() - 0.5) * 6;

      const hitX = crosshair.x;
      const hitY = crosshair.y;

      for (let t of targets) {
        if (t.checkHit(hitX, hitY)) break;
      }

      updateHud();
    }

    canvas.addEventListener('mousedown', shoot);
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      const pos = getCanvasCoordinates(touch.clientX, touch.clientY);
      crosshair.x = pos.x;
      crosshair.y = pos.y;
      shoot();
    }, { passive: false });

    // 7. Vykreslovací smyčka
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#3a2010';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#211105';
      ctx.fillRect(0, 270, canvas.width, 35);
      ctx.strokeStyle = '#5a3013';
      ctx.lineWidth = 3;
      ctx.strokeRect(0, 270, canvas.width, 35);

      for (let t of targets) {
        t.draw();
      }

      recoil.x *= 0.82;
      recoil.y *= 0.82;

      const curX = crosshair.x + recoil.x;
      const curY = crosshair.y + recoil.y;

      ctx.strokeStyle = '#e74c3c';
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.arc(curX, curY, 18, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(curX - 26, curY);
      ctx.lineTo(curX + 26, curY);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(curX, curY - 26);
      ctx.lineTo(curX, curY + 26);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(curX, curY, 2, 0, Math.PI * 2);
      ctx.fillStyle = '#e74c3c';
      ctx.fill();

      requestAnimationFrame(draw);
    }

    async function buyAmmo(count) {
      try {
        const response = await fetch('/api/payment/create-checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ammoCount: count })
        });
        const data = await response.json();
        if (data.checkoutUrl) {
          window.location.href = data.checkoutUrl;
        } else {
          alert('Chyba pokladny: ' + (data.error || 'Neznámá chyba'));
        }
      } catch (err) {
        alert('Spojení se serverem selhalo.');
      }
    }

    updateHud();
    draw();
  </script>
</body>
</html>
