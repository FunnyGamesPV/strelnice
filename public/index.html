<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pouťová Střelnice</title>

  <!-- PWA Mobilní aplikace -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#8b1e0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Střelnice">

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #110803;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      border: 6px solid #4a1c0d;
      border-radius: 8px;
      box-shadow: 0 0 25px rgba(0,0,0,0.8);
      background: #2b1d0c;
    }
    canvas {
      display: block;
      cursor: crosshair;
    }
    #ui-bar {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-size: 18px;
      font-weight: bold;
      text-shadow: 2px 2px 4px #000;
    }
    .hud-badge {
      background: rgba(0,0,0,0.6);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid #d4af37;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #lock-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(10,5,3,0.94);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      text-align: center;
      padding: 20px;
    }
    #lock-overlay h2 {
      font-size: 32px;
      color: #e74c3c;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    #lock-overlay p {
      font-size: 18px;
      margin-bottom: 24px;
      color: #ddd;
    }
    .store-grid {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .buy-btn {
      background: linear-gradient(135deg, #c0392b, #8b1e0f);
      border: 2px solid #f1c40f;
      color: #fff;
      padding: 14px 22px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      transition: transform 0.1s, background 0.2s;
    }
    .buy-btn:hover {
      transform: scale(1.04);
      background: linear-gradient(135deg, #e74c3c, #c0392b);
    }
    #admin-gate {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #110803;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>

  <div id="admin-gate" style="display: none;">
    <h1 style="color: #e74c3c; margin-bottom: 15px;">STŘELNICE MIMO PROVOZ</h1>
    <p style="color: #ccc; max-width: 400px; line-height: 1.5;">Provoz střelnice je v tuto chvíli vyhrazen pro zvané hosty. Pro přístup použijte autorizační odkaz.</p>
  </div>

  <div id="game-container">
    <canvas id="canvas" width="800" height="500"></canvas>
    
    <div id="ui-bar">
      <div class="hud-badge">🎯 Broky: <span id="ammo-count">3</span></div>
      <div class="hud-badge">🌹 Růže: <span id="rose-count">0</span></div>
      <div class="hud-badge">💰 Útrata: <span id="spent-count">0</span> Kč</div>
    </div>

    <div id="lock-overlay">
      <h2>Došly ti broky!</h2>
      <p>Kup si další střelivo a tref své růže:</p>
      <div class="store-grid">
        <button class="buy-btn" onclick="buyAmmo(10)">10 broků / 15 Kč</button>
        <button class="buy-btn" onclick="buyAmmo(25)">25 broků / 25 Kč</button>
        <button class="buy-btn" onclick="buyAmmo(50)">50 broků / 45 Kč</button>
      </div>
    </div>
  </div>

  <script>
    // 1. Zabezpečení střelnice přes tajný parametr ?admin=strelnice2026
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('admin') !== 'strelnice2026') {
      document.getElementById('admin-gate').style.display = 'flex';
      document.getElementById('game-container').style.display = 'none';
      throw new Error('Nepovolený přístup');
    }

    // 2. Stav hry a načtení po návratu z pokladny
    let ammo = parseInt(sessionStorage.getItem('strelnice_ammo')) || 3;
    let spent = parseInt(sessionStorage.getItem('strelnice_spent')) || 0;
    let rosesWon = parseInt(sessionStorage.getItem('strelnice_roses')) || 0;

    function handlePaymentReturn() {
      if (urlParams.get('payment') === 'success') {
        const addedAmmo = parseInt(urlParams.get('ammo')) || 10;
        const addedSpent = parseInt(urlParams.get('spent')) || 15;
        ammo += addedAmmo;
        spent += addedSpent;
        sessionStorage.setItem('strelnice_ammo', ammo);
        sessionStorage.setItem('strelnice_spent', spent);
        window.history.replaceState({}, document.title, window.location.pathname + '?admin=strelnice2026');
      }
    }
    handlePaymentReturn();

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const ammoDisplay = document.getElementById('ammo-count');
    const roseDisplay = document.getElementById('rose-count');
    const spentDisplay = document.getElementById('spent-count');
    const lockOverlay = document.getElementById('lock-overlay');

    function updateHud() {
      ammoDisplay.innerText = ammo;
      roseDisplay.innerText = rosesWon;
      spentDisplay.innerText = spent;
      sessionStorage.setItem('strelnice_ammo', ammo);
      sessionStorage.setItem('strelnice_roses', rosesWon);
      sessionStorage.setItem('strelnice_spent', spent);

      if (ammo <= 0) {
        lockOverlay.style.display = 'flex';
      } else {
        lockOverlay.style.display = 'none';
      }
    }

    // 3. Herní objekty (Špejle s růžemi)
    class RoseTarget {
      constructor(x, y, roseType) {
        this.x = x;
        this.y = y;
        this.stemHeight = 140;
        this.roseType = roseType; // 'red', 'yellow', 'white'
        this.hitsLeft = 3;
        this.isFallen = false;
        this.fallSpeed = 0;
      }

      draw() {
        if (this.isFallen) {
          this.y += this.fallSpeed;
          this.fallSpeed += 0.4;
          if (this.y > 600) return;
        }

        // Špejle
        ctx.strokeStyle = '#d2b48c';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x, this.y + this.stemHeight);
        ctx.stroke();

        // Záseky na špejli (zásahy)
        if (this.hitsLeft < 3) {
          ctx.strokeStyle = '#3a1f04';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(this.x - 5, this.y + 70);
          ctx.lineTo(this.x + 5, this.y + 70);
          ctx.stroke();
        }
        if (this.hitsLeft < 2) {
          ctx.beginPath();
          ctx.moveTo(this.x - 5, this.y + 80);
          ctx.lineTo(this.x + 5, this.y + 80);
          ctx.stroke();
        }

        // Papírová růže nahoře
        ctx.fillStyle = this.roseType === 'yellow' ? '#f1c40f' : (this.roseType === 'white' ? '#ecf0f1' : '#e74c3c');
        ctx.beginPath();
        ctx.arc(this.x, this.y, 22, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = this.roseType === 'yellow' ? '#d4ac0d' : (this.roseType === 'white' ? '#bdc3c7' : '#c0392b');
        ctx.beginPath();
        ctx.arc(this.x, this.y, 14, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#27ae60';
        ctx.beginPath();
        ctx.arc(this.x - 12, this.y + 14, 6, 0, Math.PI * 2);
        ctx.arc(this.x + 12, this.y + 14, 6, 0, Math.PI * 2);
        ctx.fill();
      }

      checkHit(hx, hy) {
        if (this.isFallen) return false;
        // Zásah špejle pod růží
        if (hx >= this.x - 8 && hx <= this.x + 8 && hy >= this.y + 20 && hy <= this.y + this.stemHeight) {
          this.hitsLeft--;
          if (this.hitsLeft <= 0) {
            this.isFallen = true;
            this.fallSpeed = 2;
            rosesWon++;
          }
          return true;
        }
        return false;
      }
    }

    const targets = [];
    const colors = ['red', 'yellow', 'white', 'red', 'yellow'];
    for (let i = 0; i < 5; i++) {
      targets.push(new RoseTarget(130 + i * 135, 140, colors[i]));
    }

    // 4. Míření, zpětný ráz a zaměřovač
    let crosshair = { x: 400, y: 250 };
    let recoil = { x: 0, y: 0 };

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      crosshair.x = e.clientX - rect.left;
      crosshair.y = e.clientY - rect.top;
    });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      crosshair.x = e.touches[0].clientX - rect.left;
      crosshair.y = e.touches[0].clientY - rect.top;
    }, { passive: false });

    // Střelba
    function shoot() {
      if (ammo <= 0) return;
      ammo--;
      recoil.y = -12;
      recoil.x = (Math.random() - 0.5) * 6;

      const hitX = crosshair.x;
      const hitY = crosshair.y;

      for (let t of targets) {
        if (t.checkHit(hitX, hitY)) break;
      }

      updateHud();
    }

    canvas.addEventListener('mousedown', shoot);
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      crosshair.x = e.touches[0].clientX - rect.left;
      crosshair.y = e.touches[0].clientY - rect.top;
      shoot();
    }, { passive: false });

    // 5. Hlavní vykreslovací smyčka
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Pozadí maringotky
      ctx.fillStyle = '#3a2010';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Police pro špejle
      ctx.fillStyle = '#211105';
      ctx.fillRect(0, 270, canvas.width, 35);
      ctx.strokeStyle = '#5a3013';
      ctx.lineWidth = 3;
      ctx.strokeRect(0, 270, canvas.width, 35);

      // Terče
      for (let t of targets) {
        t.draw();
      }

      // Tlumení zpětného rázu
      recoil.x *= 0.82;
      recoil.y *= 0.82;

      // Zaměřovač (kruh + vodorovná a svislá osa + středová tečka)
      const curX = crosshair.x + recoil.x;
      const curY = crosshair.y + recoil.y;

      ctx.strokeStyle = '#e74c3c';
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.arc(curX, curY, 18, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(curX - 26, curY);
      ctx.lineTo(curX + 26, curY);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(curX, curY - 26);
      ctx.lineTo(curX, curY + 26);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(curX, curY, 2, 0, Math.PI * 2);
      ctx.fillStyle = '#e74c3c';
      ctx.fill();

      requestAnimationFrame(draw);
    }

    // 6. Platební brána
    async function buyAmmo(count) {
      try {
        const response = await fetch('/api/payment/create-checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ammoCount: count })
        });
        const data = await response.json();
        if (data.checkoutUrl) {
          window.location.href = data.checkoutUrl;
        } else {
          alert('Chyba pokladny: ' + (data.error || 'Neznámá chyba'));
        }
      } catch (err) {
        alert('Spojení se serverem selhalo.');
      }
    }

    updateHud();
    draw();
  </script>
</body>
</html>
